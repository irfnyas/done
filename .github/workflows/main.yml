name: Build and Release
on:
  push:
    branches:
      - main

jobs:
  build-desktop:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install setuptools py2app
          python3 -m pip install -r requirements.txt

      - name: Build application
        run: python3 build.py py2app

      - name: Compress App
        run: |
          cd dist
          zip -r ../DONE-desktop.zip DONE.app
          cd ..

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-app
          path: DONE-desktop.zip

  build-mobile:
    name: Build Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9

      - name: Build APK
        run: |
          cd app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../DONE.apk

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-app
          path: DONE.apk

  release:
    name: Create Release
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DONE-desktop.zip
            DONE.apk
          name: "DONE v${{ github.run_number }}"
          tag_name: "v${{ github.run_number }}"
          generate_release_notes: true
